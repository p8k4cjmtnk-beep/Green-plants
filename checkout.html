<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>By Herba</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#2f4a3a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Rubik:ital,wght@1,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <meta name="robots" content="noindex">
</head>
<body data-page="checkout" data-title="checkout.title">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container">
      <div class="page-head"><h1 data-i18n="checkout.title"></h1></div>

      <div class="empty-state" id="checkout-empty" hidden>
        <p data-i18n="cart.empty"></p>
        <a href="catalog.html" class="btn btn-primary" data-i18n="hero.cta"></a>
      </div>

      <div id="card-payment" hidden style="padding-bottom:72px">
        <h2 data-i18n="checkout.cardTitle"></h2>
        <iframe id="paytr-frame" class="paytr-frame" title="PayTR" frameborder="0" scrolling="yes"></iframe>
      </div>

      <div class="checkout" id="checkout-wrap">
        <form id="checkout-form">
          <div class="card">
            <h2 data-i18n="checkout.contact"></h2>
            <div class="field"><label for="f-name" data-i18n="form.name"></label><input id="f-name" name="name" required maxlength="100" autocomplete="name"></div>
            <div class="field-row">
              <div class="field"><label for="f-phone" data-i18n="form.phone"></label><input id="f-phone" name="phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="+90 5__ ___ __ __"></div>
              <div class="field"><label for="f-email" data-i18n="form.email"></label><input id="f-email" name="email" type="email" maxlength="120" autocomplete="email"></div>
            </div>
          </div>
          <div class="card">
            <h2 data-i18n="checkout.address"></h2>
            <div class="field"><label for="f-city" data-i18n="form.city"></label><select id="f-city" name="city"></select></div>
            <div class="field" id="f-city-other-wrap" hidden><label for="f-city-other" data-i18n="form.city"></label><input id="f-city-other" name="cityOther" maxlength="60" autocomplete="address-level2"></div>
            <div class="field"><label for="f-address" data-i18n="form.address"></label><textarea id="f-address" name="address" required maxlength="400" autocomplete="street-address" style="min-height:80px"></textarea></div>
            <div class="field"><label for="f-comment" data-i18n="form.comment"></label><textarea id="f-comment" name="comment" maxlength="1000" style="min-height:70px"></textarea></div>
          </div>
          <div class="card">
            <h2 data-i18n="checkout.payment"></h2>
            <div class="pay-options" id="pay-methods"></div>
            <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
            <p class="agree"><span data-i18n="checkout.agree"></span> <a href="legal.html" target="_blank" data-i18n="checkout.agreeLink"></a></p>
            <button type="submit" class="btn btn-primary btn-block" id="checkout-submit" data-i18n="checkout.submit"></button>
            <div class="form-msg" id="checkout-msg" hidden role="alert"></div>
          </div>
        </form>
        <aside class="card summary">
          <h2 data-i18n="checkout.summary"></h2>
          <div id="summary-lines"></div>
          <div id="summary-totals" style="margin-top:12px"></div>
        </aside>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
